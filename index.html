<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3f3f3"><title>Daylist · 라이프 플래너</title><link rel="stylesheet" href="style.css"></head><body>
<header><strong><i>✓</i> Daylist</strong><span>나의 라이프 플래너</span></header>
<main><nav aria-label="화면 선택"><button data-tab="today">오늘</button><button data-tab="week">주간</button><button data-tab="goals">목표</button></nav>
<section id="today"><div class="hero"><div><small>DAILY CHECKLIST</small><h1 id="heading"></h1><p id="dateLabel"></p></div><div class="ring"><b id="score"></b></div></div>
<div class="tools"><button id="prev">‹ 전날</button><input type="date" id="date" aria-label="날짜 선택"><button id="next">다음 날 ›</button><button id="now">오늘로</button></div>
<div class="sheet"><h2>할 일</h2><div id="list"></div><form id="add"><input id="title" required maxlength="140" placeholder="새 할 일을 입력하세요" aria-label="할 일"><div class="options"><select id="category" aria-label="분류"><option>일상</option><option>공부</option><option>운동</option><option>취미</option></select><select id="repeat" aria-label="반복"><option value="once">이날만</option><option value="daily">매일 반복</option><option value="weekly">매주 같은 요일</option></select><select id="goal" aria-label="연결할 목표"></select><button class="primary">추가</button></div></form></div></section>
<section id="week" hidden><small>WEEKLY VIEW</small><h1>이번 주 한눈에</h1><div class="tools"><button id="backWeek">‹ 이전 주</button><b id="weekLabel"></b><button id="nextWeek">다음 주 ›</button></div><div class="sheet" id="weekRows"></div></section>
<section id="goals" hidden><small>LONG-TERM GOALS</small><h1>나의 목표</h1><div class="sheet"><h2>목표 목록</h2><div id="goalRows"></div><form id="newGoal"><input id="goalTitle" required maxlength="100" placeholder="예: 100km 라이딩 완주" aria-label="새 목표"><button class="primary">목표 추가</button></form></div></section>
<footer>Daylist <span>기록은 이 브라우저에 자동 저장됩니다.</span></footer></main><script src="app.js"></script></body></html>
